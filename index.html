<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QLab Cue Viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>

    <!-- ─── Landing page ─────────────────────────────────────────────── -->
    <main id="landing" class="landing" hidden>
      <div class="landing-card">
        <h1 class="landing-title">QLab Cue Viewer</h1>
        <p class="landing-sub">Enter the show code.</p>

        <form id="connect-form" class="connect-form" autocomplete="off">
          <input id="code-input" class="code-input" type="text" required autofocus
                 placeholder="show code"
                 autocapitalize="off" autocorrect="off" spellcheck="false">
          <!-- Password field is hidden by default; only revealed when the relay
               rejects an unauthenticated connection. Keeps the happy path to
               a single input + button. -->
          <label id="pass-row" class="field" hidden>
            <span>Password</span>
            <input id="pass-input" type="password" placeholder="password">
          </label>
          <div id="connect-error" class="connect-error" hidden></div>
          <button type="submit" class="connect-btn">Connect</button>
        </form>

        <section id="recent-section" class="recent" hidden>
          <h2 class="recent-title">Recent shows</h2>
          <ul id="recent-list" class="recent-list"></ul>
        </section>
      </div>
    </main>

    <!-- ─── Timeline (the existing viewer) ───────────────────────────── -->
    <header id="topbar" class="topbar" hidden>
      <button id="back-btn" class="back-btn" title="Switch session" aria-label="Switch session">◀</button>
      <div class="title">
        <div id="group-context" class="group-context" hidden></div>
        <div id="group-current" class="group-current" hidden></div>
      </div>
      <div class="meta">
        <div id="tc" class="tc" hidden>
          <span id="tc-text" class="tc-text">--:--:--:--</span>
          <button id="tc-out" class="tc-out" aria-pressed="false"
                  title="Play LTC out of this device's audio output">LTC out</button>
          <select id="tc-device" class="tc-device" hidden
                  title="Which audio output the LTC goes to"></select>
          <label id="tc-offset-wrap" class="tc-offset" hidden>
            <input id="tc-offset" type="number" step="10" min="-5000" max="5000" value="0">
            <span>ms</span>
            <input id="tc-frames" type="number" step="1" min="-250" max="250" value="0">
            <span>f</span>
          </label>
        </div>
        <button id="ws-toggle" class="playhead-toggle" title="Show the whole workspace"
                aria-label="Show the whole workspace" aria-pressed="false">☰</button>
        <button id="playhead-toggle" class="playhead-toggle" title="Toggle playhead overlay" aria-label="Toggle playhead overlay" aria-pressed="false">◐</button>
        <span id="ts" class="ts"></span>
        <span id="status" class="status disconnected">connecting…</span>
      </div>
    </header>

    <div id="stage" class="stage" hidden>
    <aside id="workspace" class="workspace" hidden>
      <div class="workspace-head">
        <span>Workspace</span>
        <button id="ws-follow" class="ws-follow" aria-pressed="true"
                title="Keep the running cue in view">follow</button>
      </div>
      <div id="ws-list" class="ws-list"></div>
    </aside>

    <main id="timeline" class="timeline" hidden>
      <div id="ruler" class="ruler"></div>
      <div id="lanes" class="lanes"></div>
      <div id="playhead" class="playhead" hidden></div>
      <div id="empty" class="empty">waiting for cues…</div>
    </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
